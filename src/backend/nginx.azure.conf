# ==============================================================================
# Nginx Reverse Proxy — Produção Azure VM (vm-fecap-secretaria)
# Cópia fiel da configuração HTTP implantada na VM Azure (sem HTTPS/TLS ativo).
# ==============================================================================
# • Expõe ponto único de entrada HTTP na porta 80.
# • Não expõe diretamente as portas 8000 (FastAPI) nem 5173 na internet.
# • Roteia /api/* e /health para http://backend:8000 na rede interna Docker.
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Limite de upload compatível com MAX_DOCUMENT_SIZE_MB (10 MB)
    client_max_body_size 12M;
    server_tokens off;

    # Headers de Segurança HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Compressão Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    # Diretório preparatório para desafio ACME Let's Encrypt (futura emissão HTTPS)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy reverso para todas as rotas da API FastAPI (/api/v1/...)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Proxy para Healthcheck unificado
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA React (arquivos estáticos compilados pelo Vite)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
}
